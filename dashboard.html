<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TokenFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --yellow:    #f5d800;
  --black:     #1a1a1a;
  --gray:      #888;
  --card-dark: #1f1f1f;
  --white:     #ffffff;
  --gap:       16px;
  --r:         16px;
  --pad:       22px;
}

body {
  font-family: 'DM Sans', sans-serif;
  font-weight: 400;
  background: linear-gradient(160deg, #f7f6f0 0%, #fdf9d0 100%);
  min-height: 100vh;
  color: var(--black);
}

/* ── NAV ──────────────────────────────────────────────────────────────── */

nav {
  display: flex;
  align-items: center;
  padding: 16px 32px;
  gap: 16px;
}

.logo-pill {
  background: var(--black);
  color: var(--yellow);
  font-weight: 700;
  font-size: 13px;
  padding: 8px 20px;
  border-radius: 999px;
  letter-spacing: .03em;
  flex-shrink: 0;
}

.nav-links {
  flex: 1;
  display: flex;
  justify-content: center;
  gap: 4px;
}

.nav-link {
  font-size: 13px;
  font-weight: 400;
  color: var(--gray);
  padding: 7px 20px;
  border-radius: 999px;
  border: none;
  background: transparent;
  cursor: pointer;
  transition: all .15s;
}
.nav-link.on { background: var(--black); color: var(--white); font-weight: 700; }
.nav-link:not(.on):hover { color: var(--black); }

.nav-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.live-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #22c55e;
  animation: blink 2.5s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

.ts { font-size: 11px; color: var(--gray); }

.mode-capsule {
  display: flex;
  background: rgba(0,0,0,.07);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}
.mode-btn {
  font-size: 11px; font-weight: 700;
  padding: 5px 16px;
  border-radius: 999px;
  border: none; cursor: pointer;
  background: transparent; color: var(--gray);
  transition: all .2s;
}
.mode-btn.on { background: var(--black); color: var(--white); }

/* ── KPI STRIP ────────────────────────────────────────────────────────── */

.kpi-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--gap);
  padding: 0 32px 16px;
}

.kpi {
  background: var(--white);
  border-radius: var(--r);
  padding: 18px var(--pad);
  box-shadow: 0 2px 20px rgba(0,0,0,.05);
}

.kpi-lbl {
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .1em;
  color: var(--gray); margin-bottom: 8px;
}

.kpi-num {
  font-size: 42px; font-weight: 700;
  line-height: 1; color: var(--black);
  margin-bottom: 10px;
}
.kpi-num .unit { font-size: 16px; font-weight: 400; color: var(--gray); }

.pill-track {
  background: #ebebeb;
  border-radius: 999px;
  height: 8px; overflow: hidden;
}
.pill-fill {
  height: 100%; border-radius: 999px;
  background: var(--yellow);
  transition: width .8s ease, background .4s;
}
.pill-fill.hi   { background: #ef4444; }
.pill-fill.mid  { background: #f97316; }

/* ── MAIN GRID ────────────────────────────────────────────────────────── */

.main-grid {
  display: grid;
  grid-template-columns: 256px 1fr 210px 240px;
  gap: var(--gap);
  padding: 0 32px 16px;
}

.card {
  background: var(--white);
  border-radius: var(--r);
  padding: var(--pad);
  box-shadow: 0 2px 20px rgba(0,0,0,.05);
}

.card-dark {
  background: var(--card-dark);
  border-radius: var(--r);
  padding: var(--pad);
  box-shadow: 0 2px 20px rgba(0,0,0,.12);
  color: var(--white);
}

.sect-label {
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .1em;
  color: var(--gray); margin-bottom: 16px;
}
.card-dark .sect-label { color: #4a4a4a; }

/* ── COL 1 · User cards ───────────────────────────────────────────────── */

.u-stack { display: flex; flex-direction: column; gap: 10px; }

.u-row {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 14px;
  background: #f8f8f4;
  border-radius: 12px;
  transition: background .2s;
}
.u-row.top-user { background: var(--black); }
.u-row.top-user .u-name { color: var(--white); }
.u-row.top-user .u-role { color: #555; }
.u-row.top-user .u-pct  { color: var(--yellow); }

.u-avatar {
  width: 42px; height: 42px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px;
  flex-shrink: 0;
}

.u-meta  { flex: 1; min-width: 0; }
.u-name  { font-size: 13px; font-weight: 700; color: var(--black); }
.u-role  { font-size: 10px; color: var(--gray); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }
.u-pct   { font-size: 14px; font-weight: 700; color: var(--black); flex-shrink: 0; }

.u-mini-track {
  background: rgba(0,0,0,.07);
  border-radius: 999px; height: 5px; overflow: hidden; margin-top: 7px;
}
.u-row.top-user .u-mini-track { background: rgba(255,255,255,.1); }

.u-mini-fill {
  height: 100%; border-radius: 999px;
  transition: width .8s ease;
}

/* ── COL 2 · Bar chart ────────────────────────────────────────────────── */

.bar-chart-wrap {
  display: flex; align-items: flex-end;
  gap: 20px; height: 180px;
  margin-top: 4px;
}

.b-col { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }

.b-slot {
  width: 100%; position: relative;
  background: #f0f0ee; border-radius: 8px;
  overflow: hidden;
}

.b-fill {
  position: absolute; bottom: 0; left: 0; right: 0;
  border-radius: 8px;
  transition: height .8s ease, background .4s;
}

.b-col.hi .b-fill  { background: var(--yellow); }
.b-col:not(.hi) .b-fill { background: rgba(26,26,26,.18); }

.b-label { font-size: 11px; font-weight: 700; color: var(--gray); text-transform: uppercase; }
.b-col.hi .b-label { color: var(--black); }

.b-val { font-size: 11px; color: var(--gray); }

/* ── COL 3 · Circular gauge ───────────────────────────────────────────── */

.gauge-wrap {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100%; gap: 10px;
}

.gauge-sub { font-size: 12px; color: var(--gray); text-align: center; line-height: 1.4; }

/* ── COL 4 · Dark checklist ───────────────────────────────────────────── */

.chk-list { display: flex; flex-direction: column; gap: 10px; }

.chk-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px;
  background: rgba(255,255,255,.04);
  border-radius: 10px;
  transition: opacity .3s;
}
.chk-item.done { opacity: .45; }

.chk-circle {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid #383838;
  flex-shrink: 0; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700;
  transition: all .2s;
}
.chk-circle.ok  { background: var(--yellow); border-color: var(--yellow); color: var(--black); }
.chk-circle.bad { background: #ef4444;       border-color: #ef4444;       color: var(--white); }

.chk-body    { flex: 1; min-width: 0; }
.chk-name    { font-size: 12px; font-weight: 700; color: var(--white); }
.chk-detail  { font-size: 10px; color: #555; margin-top: 2px; }
.chk-reason  { font-size: 10px; color: #484848; margin-top: 4px; font-style: italic; }
.chk-actions { display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; }

.chk-input {
  background: rgba(255,255,255,.06);
  border: 1px solid #333; border-radius: 6px;
  color: var(--white); font-size: 10px; font-family: inherit;
  padding: 4px 8px; width: 76px;
}
.chk-input:focus { outline: none; border-color: var(--yellow); }

.btn-a {
  font-size: 10px; font-weight: 700;
  padding: 5px 14px; border-radius: 999px;
  border: none; cursor: pointer;
  background: var(--yellow); color: var(--black);
  transition: opacity .15s;
}
.btn-a:hover { opacity: .8; }

.btn-d {
  font-size: 10px; font-weight: 700;
  padding: 5px 14px; border-radius: 999px;
  border: none; cursor: pointer;
  background: rgba(239,68,68,.14); color: #ef4444;
  transition: all .15s;
}
.btn-d:hover { background: #ef4444; color: var(--white); }

.chk-empty { font-size: 12px; color: #3a3a3a; text-align: center; padding: 24px 0; }

/* ── TIMELINE STRIP ───────────────────────────────────────────────────── */

.tl-strip {
  margin: 0 32px 32px;
  background: var(--white);
  border-radius: var(--r);
  padding: var(--pad);
  box-shadow: 0 2px 20px rgba(0,0,0,.05);
}

.tl-scroll {
  display: flex; gap: 8px;
  overflow-x: auto; padding-bottom: 2px;
  margin-top: 14px;
}
.tl-scroll::-webkit-scrollbar { height: 3px; }
.tl-scroll::-webkit-scrollbar-thumb { background: #e8e8e0; border-radius: 999px; }

.tl-item {
  display: flex; flex-direction: column;
  align-items: flex-start; gap: 4px;
  flex-shrink: 0;
}

.tl-time { font-size: 9px; color: var(--gray); padding: 0 6px; }

.tl-pill {
  font-size: 10px; font-weight: 700;
  padding: 6px 16px; border-radius: 999px;
  white-space: nowrap;
}

.tl-pill.allow    { background: var(--black);   color: var(--white); }
.tl-pill.borrow   { background: var(--black);   color: var(--yellow); }
.tl-pill.block    { background: #ef4444;         color: var(--white); }
.tl-pill.request  { background: #ebebeb;         color: var(--black); }
.tl-pill.approved { background: var(--yellow);   color: var(--black); }
.tl-pill.denied   { background: #ebebeb;         color: var(--gray); }

.tl-empty { font-size: 12px; color: var(--gray); padding: 6px; }
</style>
</head>
<body>

<!-- ── NAV ──────────────────────────────────────────────────────────────── -->
<nav>
  <div class="logo-pill">TokenFlow</div>
  <div class="nav-links">
    <button class="nav-link on">Overview</button>
    <button class="nav-link">Usage</button>
    <button class="nav-link">Events</button>
  </div>
  <div class="nav-right">
    <div class="live-dot"></div>
    <span class="ts" id="last-updated">—</span>
    <div class="mode-capsule">
      <button class="mode-btn" id="btn-auto"   onclick="setMode('auto')">Auto</button>
      <button class="mode-btn" id="btn-manual" onclick="setMode('manual')">Manual</button>
    </div>
  </div>
</nav>

<!-- ── KPI STRIP ─────────────────────────────────────────────────────────── -->
<div class="kpi-strip">
  <div class="kpi">
    <div class="kpi-lbl">Shared Pool</div>
    <div class="kpi-num" id="kpi-pool-n">—<span class="unit"> k</span></div>
    <div class="pill-track"><div class="pill-fill" id="kpi-pool-bar" style="width:0%"></div></div>
  </div>
  <div class="kpi" id="kpi-u0">
    <div class="kpi-lbl" id="kpi-u0-lbl">—</div>
    <div class="kpi-num" id="kpi-u0-n">—<span class="unit">%</span></div>
    <div class="pill-track"><div class="pill-fill" id="kpi-u0-bar" style="width:0%"></div></div>
  </div>
  <div class="kpi" id="kpi-u1">
    <div class="kpi-lbl" id="kpi-u1-lbl">—</div>
    <div class="kpi-num" id="kpi-u1-n">—<span class="unit">%</span></div>
    <div class="pill-track"><div class="pill-fill" id="kpi-u1-bar" style="width:0%"></div></div>
  </div>
  <div class="kpi" id="kpi-u2">
    <div class="kpi-lbl" id="kpi-u2-lbl">—</div>
    <div class="kpi-num" id="kpi-u2-n">—<span class="unit">%</span></div>
    <div class="pill-track"><div class="pill-fill" id="kpi-u2-bar" style="width:0%"></div></div>
  </div>
</div>

<!-- ── MAIN GRID ─────────────────────────────────────────────────────────── -->
<div class="main-grid">

  <!-- Col 1 · Users -->
  <div class="card">
    <div class="sect-label">Users</div>
    <div class="u-stack" id="u-stack">
      <div style="color:#ccc;font-size:12px">loading…</div>
    </div>
  </div>

  <!-- Col 2 · Bar chart -->
  <div class="card">
    <div class="sect-label">Usage vs Limit</div>
    <div class="bar-chart-wrap" id="bar-chart"></div>
  </div>

  <!-- Col 3 · Circular gauge -->
  <div class="card">
    <div class="sect-label">Pool Remaining</div>
    <div class="gauge-wrap">
      <svg width="156" height="156" viewBox="0 0 156 156" style="overflow:visible">
        <circle fill="none" stroke="#f0f0ee" stroke-width="14" cx="78" cy="78" r="64"/>
        <circle id="gauge-arc" fill="none" stroke="#f5d800" stroke-width="14"
          stroke-linecap="round"
          cx="78" cy="78" r="64"
          stroke-dasharray="402.12"
          stroke-dashoffset="402.12"
          transform="rotate(-90 78 78)"
          style="transition: stroke-dashoffset .8s ease"/>
        <text text-anchor="middle" dominant-baseline="middle"
          x="78" y="74"
          font-family="DM Sans,sans-serif" font-weight="700" font-size="40"
          fill="#1a1a1a" id="gauge-pct">—</text>
        <text text-anchor="middle" dominant-baseline="middle"
          x="78" y="100"
          font-family="DM Sans,sans-serif" font-weight="400" font-size="11"
          fill="#888">% pool left</text>
      </svg>
      <div class="gauge-sub" id="gauge-detail">loading…</div>
    </div>
  </div>

  <!-- Col 4 · Dark checklist -->
  <div class="card-dark">
    <div class="sect-label">Pending Requests</div>
    <div class="chk-list" id="chk-list">
      <div class="chk-empty">no pending requests</div>
    </div>
  </div>

</div>

<!-- ── TIMELINE STRIP ────────────────────────────────────────────────────── -->
<div class="tl-strip">
  <div class="sect-label">Event Timeline</div>
  <div class="tl-scroll" id="tl-scroll">
    <div class="tl-empty">no events yet — run demo.js to generate traffic</div>
  </div>
</div>

<script>
const CIRC = 2 * Math.PI * 64; // 402.12

let currentMode   = 'manual';
let lastUsersJSON = '';
let seenEventTs   = new Set();
let renderedReqs  = {};

function fmt(n)  { return (n || 0).toLocaleString(); }
function fmtK(n) { return n >= 1000 ? (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1) + 'k' : String(n || 0); }

const AVATAR_BG   = ['#f5d800', '#1a1a1a', '#e8e4d0'];
const AVATAR_FG   = ['#1a1a1a', '#f5d800', '#888'];

// ── Mode ─────────────────────────────────────────────────────────────────────

function updateModeUI(mode) {
  currentMode = mode;
  document.getElementById('btn-auto').className   = 'mode-btn' + (mode === 'auto'   ? ' on' : '');
  document.getElementById('btn-manual').className = 'mode-btn' + (mode === 'manual' ? ' on' : '');
}

async function setMode(mode) {
  try {
    await fetch('/admin/mode', {
      method: 'POST', headers: {'content-type':'application/json'},
      body: JSON.stringify({mode})
    });
    updateModeUI(mode);
  } catch(e) {}
}

// ── Pool ──────────────────────────────────────────────────────────────────────

async function fetchPool() {
  try {
    const d   = await fetch('/admin/pool').then(r => r.json());
    const pct = d.pct || 0;

    // KPI
    document.getElementById('kpi-pool-n').innerHTML = fmtK(d.available) + '<span class="unit"> tokens</span>';
    const pb = document.getElementById('kpi-pool-bar');
    pb.style.width   = Math.min(pct, 100) + '%';
    pb.className     = 'pill-fill' + (pct < 30 ? ' hi' : pct < 60 ? ' mid' : '');

    // Gauge
    const offset = CIRC * (1 - Math.min(pct, 100) / 100);
    document.getElementById('gauge-arc').style.strokeDashoffset = offset;
    document.getElementById('gauge-pct').textContent = Math.round(pct) + '%';
    document.getElementById('gauge-detail').textContent = fmt(d.available) + ' of ' + fmt(d.total);
  } catch(e) {}
}

// ── Usage ─────────────────────────────────────────────────────────────────────

async function fetchUsage() {
  try {
    const d     = await fetch('/admin/usage').then(r => r.json());
    const users = d.users || [];
    const newJ  = JSON.stringify(users);
    if (newJ === lastUsersJSON) return;
    lastUsersJSON = newJ;

    const maxAlloc   = Math.max(...users.map(u => u.allocation), 1);
    const highestPct = Math.max(...users.map(u => u.pct || 0));

    // ── KPI per user
    users.slice(0, 3).forEach((u, i) => {
      const lbl = document.getElementById(`kpi-u${i}-lbl`);
      const num = document.getElementById(`kpi-u${i}-n`);
      const bar = document.getElementById(`kpi-u${i}-bar`);
      if (!lbl) return;
      lbl.textContent = u.name || u.role;
      num.innerHTML   = Math.round(u.pct) + '<span class="unit">%</span>';
      bar.style.width = Math.min(u.pct, 100) + '%';
      bar.className   = 'pill-fill' + (u.pct > 90 ? ' hi' : u.pct > 70 ? ' mid' : '');
    });

    // ── User stack (col 1)
    const stack = document.getElementById('u-stack');
    stack.innerHTML = users.map((u, i) => {
      const initials  = (u.name || u.email).slice(0, 2).toUpperCase();
      const isTop     = u.pct >= highestPct && u.pct > 0;
      const usedPct   = Math.min(u.used / u.allocation * 100, 100);
      const fillColor = isTop ? '#f5d800' : (usedPct > 90 ? '#ef4444' : 'rgba(26,26,26,.25)');
      const extraTag  = u.extra > 0 ? `<span style="font-size:9px;color:#22c55e;margin-left:4px">+${fmtK(u.extra)}</span>` : '';
      return `
        <div class="u-row ${isTop ? 'top-user' : ''}">
          <div class="u-avatar" style="background:${AVATAR_BG[i%3]};color:${AVATAR_FG[i%3]}">${initials}</div>
          <div class="u-meta">
            <div class="u-name">${u.name || u.email}${extraTag}</div>
            <div class="u-role">${u.role}</div>
            <div class="u-mini-track">
              <div class="u-mini-fill" style="width:${usedPct}%;background:${fillColor}"></div>
            </div>
          </div>
          <div class="u-pct">${u.pct}%</div>
        </div>`;
    }).join('');

    // ── Bar chart (col 2)
    const CHART_H = 160;
    const chart   = document.getElementById('bar-chart');
    chart.innerHTML = users.map((u, i) => {
      const isTop  = u.pct >= highestPct && u.pct > 0;
      const fillH  = Math.max(Math.round(u.used / maxAlloc * CHART_H), 2);
      return `
        <div class="b-col ${isTop ? 'hi' : ''}">
          <div class="b-val">${fmtK(u.used)}</div>
          <div class="b-slot" style="height:${CHART_H}px">
            <div class="b-fill" style="height:${fillH}px"></div>
          </div>
          <div class="b-label">${u.name || u.role}</div>
        </div>`;
    }).join('');

  } catch(e) {}
}

// ── Events → Timeline ────────────────────────────────────────────────────────

async function fetchEvents() {
  try {
    const d      = await fetch('/admin/events?limit=60').then(r => r.json());
    const events = d.events || [];
    const el     = document.getElementById('tl-scroll');
    if (!events.length) return;

    const newEvs = events.filter(e => !seenEventTs.has(e.ts));
    if (!newEvs.length) return;

    const ph = el.querySelector('.tl-empty');
    if (ph) el.innerHTML = '';

    newEvs.forEach(e => {
      const time  = (e.ts || '').slice(11, 16);
      const name  = (e.user || '').split('@')[0];
      const cls   = e.type;
      const label = e.type === 'allow'    ? '✓ Allow'
                  : e.type === 'borrow'   ? '~ Borrow'
                  : e.type === 'block'    ? '✗ Block'
                  : e.type === 'request'  ? '↑ Request'
                  : e.type === 'approved' ? '✓ Granted'
                  : e.type === 'denied'   ? '✗ Denied'
                  : e.type;
      const div = document.createElement('div');
      div.className = 'tl-item';
      div.innerHTML = `<div class="tl-time">${time} · ${name}</div><div class="tl-pill ${cls}">${label}</div>`;
      el.insertBefore(div, el.firstChild);
      seenEventTs.add(e.ts);
    });

    while (el.children.length > 60) el.removeChild(el.lastChild);
    if (seenEventTs.size > 400) seenEventTs = new Set([...seenEventTs].slice(-200));
  } catch(e) {}
}

// ── Requests → Checklist ─────────────────────────────────────────────────────

async function fetchRequests() {
  try {
    const d        = await fetch('/admin/requests').then(r => r.json());
    const requests = d.requests || [];
    const mode     = d.mode || 'manual';
    if (mode !== currentMode) updateModeUI(mode);

    const el = document.getElementById('chk-list');

    if (!requests.length) {
      el.innerHTML = '<div class="chk-empty">no pending requests</div>';
      renderedReqs = {};
      return;
    }

    const currentIds = new Set(requests.slice(0, 8).map(r => r.id));
    Object.keys(renderedReqs).forEach(id => {
      if (!currentIds.has(id)) {
        const c = document.getElementById('cr-' + id);
        if (c) c.remove();
        delete renderedReqs[id];
      }
    });

    const ph = el.querySelector('.chk-empty');
    if (ph) el.innerHTML = '';

    requests.slice(0, 8).forEach((req, i) => {
      const existing = document.getElementById('cr-' + req.id);
      if (existing) {
        if (renderedReqs[req.id] !== req.status) {
          renderedReqs[req.id] = req.status;
          existing.className = 'chk-item' + (req.status !== 'pending' ? ' done' : '');
          const circ = existing.querySelector('.chk-circle');
          if (circ) {
            circ.className   = 'chk-circle' + (req.status === 'approved' ? ' ok' : req.status === 'denied' ? ' bad' : '');
            circ.textContent = req.status === 'approved' ? '✓' : req.status === 'denied' ? '✗' : '';
          }
          const act = existing.querySelector('.chk-actions');
          if (act) act.innerHTML = req.status !== 'pending' ? resolvedHTML(req) : pendingHTML(req);
        }
        return;
      }

      renderedReqs[req.id] = req.status;
      const name = (req.email || '').split('@')[0];
      const div  = document.createElement('div');
      div.id        = 'cr-' + req.id;
      div.className = 'chk-item' + (req.status !== 'pending' ? ' done' : '');
      div.innerHTML = `
        <div class="chk-circle ${req.status==='approved'?'ok':req.status==='denied'?'bad':''}">${req.status==='approved'?'✓':req.status==='denied'?'✗':''}</div>
        <div class="chk-body">
          <div class="chk-name">${name}</div>
          <div class="chk-detail">${fmt(req.amount)} tokens · ${(req.ts||'').slice(11,16)} UTC</div>
          <div class="chk-reason">"${req.reason || ''}"</div>
          <div class="chk-actions">${req.status==='pending' ? pendingHTML(req) : resolvedHTML(req)}</div>
        </div>`;
      el.insertBefore(div, el.children[i] || null);
    });
  } catch(e) {}
}

function pendingHTML(req) {
  return `
    <input class="chk-input" id="ci-${req.id}" type="number" value="${req.amount}" step="1000">
    <button class="btn-a" onclick="approveReq('${req.id}')">Approve</button>
    <button class="btn-d" onclick="denyReq('${req.id}')">Deny</button>`;
}

function resolvedHTML(req) {
  return req.status === 'approved'
    ? `<span style="font-size:10px;color:#f5d800;font-weight:700">✓ ${fmt(req.granted)} granted</span>`
    : `<span style="font-size:10px;color:#ef4444;font-weight:700">✗ Denied</span>`;
}

async function approveReq(id) {
  const input  = document.getElementById('ci-' + id);
  const amount = parseInt(input?.value || 0, 10) || 0;
  freeze('cr-' + id, true);
  try {
    await fetch(`/admin/requests/${id}/approve`, {
      method: 'POST', headers: {'content-type':'application/json'},
      body: JSON.stringify({amount})
    });
    await refresh();
  } catch(e) { freeze('cr-' + id, false); }
}

async function denyReq(id) {
  freeze('cr-' + id, true);
  try {
    await fetch(`/admin/requests/${id}/deny`, { method: 'POST' });
    await refresh();
  } catch(e) { freeze('cr-' + id, false); }
}

function freeze(id, on) {
  const el = document.getElementById(id);
  if (el) { el.style.opacity = on ? '.4' : ''; el.style.pointerEvents = on ? 'none' : ''; }
}

// ── Refresh ───────────────────────────────────────────────────────────────────

async function refresh() {
  await Promise.all([fetchPool(), fetchUsage(), fetchEvents(), fetchRequests()]);
  document.getElementById('last-updated').textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

(async () => {
  try {
    const d = await fetch('/admin/mode').then(r => r.json());
    updateModeUI(d.mode || 'manual');
  } catch(e) { updateModeUI('manual'); }
  await refresh();
})();

setInterval(refresh, 4000);
</script>
</body>
</html>
