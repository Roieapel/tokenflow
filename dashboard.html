<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TokenFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --yellow:  #f5d800;
  --black:   #1a1a1a;
  --gray:    #888;
  --white:   #ffffff;
  --red:     #ef4444;
  --green:   #22c55e;
  --gap:     16px;
  --r:       16px;
  --pad:     24px;
}

body {
  font-family: 'DM Sans', sans-serif;
  font-weight: 400;
  background: linear-gradient(160deg, #f7f6f0 0%, #fdf9d0 100%);
  min-height: 100vh;
  color: var(--black);
}

/* ══════════════════════════════════════════════════════════
   LOGIN SCREEN
══════════════════════════════════════════════════════════ */

#login-screen {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(160deg, #f7f6f0 0%, #fdf9d0 100%);
  z-index: 100;
}

#login-screen.hidden { display: none; }

.login-card {
  background: var(--white);
  border-radius: 24px;
  padding: 48px 44px 40px;
  width: 400px;
  box-shadow: 0 8px 48px rgba(0,0,0,.10);
}

.login-logo {
  display: inline-block;
  background: var(--black);
  color: var(--yellow);
  font-weight: 700;
  font-size: 14px;
  padding: 8px 22px;
  border-radius: 999px;
  letter-spacing: .03em;
  margin-bottom: 32px;
}

.login-title {
  font-size: 26px; font-weight: 700;
  color: var(--black);
  margin-bottom: 6px;
}

.login-sub {
  font-size: 13px; color: var(--gray);
  margin-bottom: 32px;
}

.login-field {
  display: flex; flex-direction: column; gap: 6px;
  margin-bottom: 16px;
}

.login-field label {
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .08em;
  color: var(--gray);
}

.login-input {
  background: #f5f5f0;
  border: 1.5px solid transparent;
  border-radius: 12px;
  padding: 12px 16px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  color: var(--black);
  transition: border-color .2s;
  width: 100%;
}
.login-input:focus { outline: none; border-color: var(--yellow); }
.login-input.err   { border-color: var(--red) !important; }

.login-btn {
  width: 100%; margin-top: 10px;
  padding: 14px;
  border-radius: 12px;
  border: none; cursor: pointer;
  background: var(--black); color: var(--yellow);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px; font-weight: 700;
  letter-spacing: .02em;
  transition: opacity .15s;
}
.login-btn:hover { opacity: .85; }
.login-btn:disabled { opacity: .4; cursor: default; }

.login-err {
  font-size: 12px; color: var(--red);
  margin-top: 12px; text-align: center;
  min-height: 18px;
}

@keyframes shake {
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(5px)}
}
.shake { animation: shake .35s ease; }

/* ══════════════════════════════════════════════════════════
   DASHBOARD (hidden until login)
══════════════════════════════════════════════════════════ */

#dashboard { display: none; }
#dashboard.visible { display: block; }

/* ── NAV ──────────────────────────────────────────────────────────────── */

nav {
  display: flex; align-items: center;
  padding: 16px 32px; gap: 16px;
}

.logo-pill {
  background: var(--black); color: var(--yellow);
  font-weight: 700; font-size: 13px;
  padding: 8px 20px; border-radius: 999px;
  letter-spacing: .03em; flex-shrink: 0;
}

.nav-center { flex: 1; display: flex; justify-content: center; align-items: center; gap: 10px; }

.live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green); animation: blink 2.5s infinite;
}
.live-dot.off { background: #ccc; animation: none; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

.ts { font-size: 11px; color: var(--gray); }

.nav-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

/* Demo button */
.demo-btn {
  font-size: 11px; font-weight: 700;
  padding: 7px 18px; border-radius: 999px;
  border: 1.5px solid var(--black); cursor: pointer;
  background: transparent; color: var(--black);
  transition: all .2s;
  white-space: nowrap;
}
.demo-btn:hover:not(:disabled) { background: var(--black); color: var(--yellow); }
.demo-btn:disabled { opacity: .4; cursor: default; }
.demo-btn.running  { background: var(--yellow); color: var(--black); border-color: var(--yellow); }

/* Mode capsule */
.mode-capsule {
  display: flex; background: rgba(0,0,0,.07);
  border-radius: 999px; padding: 3px; gap: 2px;
}
.mode-btn {
  font-size: 11px; font-weight: 700;
  padding: 5px 16px; border-radius: 999px;
  border: none; cursor: pointer;
  background: transparent; color: var(--gray);
  transition: all .2s;
}
.mode-btn.on { background: var(--black); color: var(--white); }

/* Logout */
.logout-btn {
  font-size: 11px; color: var(--gray);
  background: none; border: none; cursor: pointer;
  padding: 6px 10px; border-radius: 8px;
  transition: color .15s;
}
.logout-btn:hover { color: var(--black); }

/* ── SHARED CARD ──────────────────────────────────────────────────────── */

.card {
  background: var(--white);
  border-radius: var(--r);
  padding: var(--pad);
  box-shadow: 0 2px 20px rgba(0,0,0,.05);
}

.sect-label {
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .1em;
  color: var(--gray); margin-bottom: 16px;
}

/* ── USER USAGE CHART ─────────────────────────────────────────────────── */

.usage-card { margin: 0 32px 16px; }

.user-rows { display: flex; flex-direction: column; gap: 14px; }

.u-row { display: flex; align-items: center; gap: 14px; }

.u-role-tag {
  font-size: 9px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em; color: var(--gray);
  background: #f0f0ee; padding: 2px 8px; border-radius: 999px;
  flex-shrink: 0; width: 70px; text-align: center;
}

.u-email {
  font-size: 13px; color: var(--black);
  width: 200px; flex-shrink: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.u-bar-wrap {
  flex: 1; height: 28px;
  background: #f0f0ee; border-radius: 8px;
  overflow: hidden; position: relative;
}

.u-bar-fill {
  height: 100%; border-radius: 8px;
  transition: width .9s ease, background .4s;
  background: var(--yellow);
}
.u-bar-fill.over { background: var(--red); }
.u-bar-fill.warn { background: #f97316; }

.u-limit-line {
  position: absolute; top: 0; bottom: 0;
  width: 2px; background: rgba(0,0,0,.15);
}

.u-stats {
  display: flex; flex-direction: column;
  align-items: flex-end; width: 120px; flex-shrink: 0;
}
.u-pct { font-size: 15px; font-weight: 700; }
.u-pct.over { color: var(--red); }
.u-counts { font-size: 10px; color: var(--gray); }

/* ── POOL CHART ───────────────────────────────────────────────────────── */

.pool-card { margin: 0 32px 16px; }

.pool-body { display: flex; align-items: center; gap: 20px; }

.pool-bar-wrap {
  flex: 1; height: 36px;
  background: #f0f0ee; border-radius: 10px; overflow: hidden;
}
.pool-bar-fill {
  height: 100%; border-radius: 10px;
  background: var(--black);
  transition: width .9s ease, background .4s;
}
.pool-bar-fill.low { background: var(--red); }
.pool-bar-fill.mid { background: #f97316; }

.pool-nums { display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0; width: 150px; }
.pool-pct { font-size: 24px; font-weight: 700; line-height: 1; }
.pool-pct.low { color: var(--red); }
.pool-detail { font-size: 11px; color: var(--gray); margin-top: 3px; }

/* ── BOTTOM GRID ──────────────────────────────────────────────────────── */

.bottom-grid {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: var(--gap);
  margin: 0 32px 32px;
}

/* ── EVENT TIMELINE ───────────────────────────────────────────────────── */

.tl-list {
  display: flex; flex-direction: column; gap: 6px;
  max-height: 380px; overflow-y: auto;
}
.tl-list::-webkit-scrollbar { width: 3px; }
.tl-list::-webkit-scrollbar-thumb { background: #e8e8e0; border-radius: 999px; }

.tl-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 10px;
  background: #f8f8f4;
  animation: fadeIn .25s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }

.tl-badge {
  font-size: 10px; font-weight: 700;
  padding: 3px 10px; border-radius: 999px;
  white-space: nowrap; flex-shrink: 0;
}
.tl-badge.allow    { background: var(--black);  color: var(--white); }
.tl-badge.borrow   { background: var(--black);  color: var(--yellow); }
.tl-badge.block    { background: var(--red);    color: var(--white); }
.tl-badge.request  { background: #ebebeb;       color: var(--black); }
.tl-badge.approved { background: var(--yellow); color: var(--black); }
.tl-badge.denied   { background: #ebebeb;       color: var(--gray); }

.tl-email { font-size: 12px; color: var(--black); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-time  { font-size: 10px; color: var(--gray); flex-shrink: 0; }
.tl-empty { font-size: 12px; color: var(--gray); padding: 20px 0; text-align: center; }

/* ── PENDING REQUESTS ─────────────────────────────────────────────────── */

.card-dark {
  background: #1f1f1f; border-radius: var(--r);
  padding: var(--pad); color: var(--white);
}
.card-dark .sect-label { color: #4a4a4a; }

.chk-list { display: flex; flex-direction: column; gap: 10px; max-height: 340px; overflow-y: auto; }

.chk-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px; background: rgba(255,255,255,.04);
  border-radius: 10px; transition: opacity .3s;
}
.chk-item.done { opacity: .45; }

.chk-circle {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid #383838; flex-shrink: 0; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; transition: all .2s;
}
.chk-circle.ok  { background: var(--yellow); border-color: var(--yellow); color: var(--black); }
.chk-circle.bad { background: var(--red);    border-color: var(--red);    color: var(--white); }

.chk-body   { flex: 1; min-width: 0; }
.chk-name   { font-size: 12px; font-weight: 700; color: var(--white); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chk-detail { font-size: 10px; color: #555; margin-top: 2px; }
.chk-reason { font-size: 10px; color: #484848; margin-top: 4px; font-style: italic; }
.chk-actions { display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; }

.chk-input {
  background: rgba(255,255,255,.06);
  border: 1px solid #333; border-radius: 6px;
  color: var(--white); font-size: 10px; font-family: inherit;
  padding: 4px 8px; width: 80px;
}
.chk-input:focus { outline: none; border-color: var(--yellow); }

.btn-a {
  font-size: 10px; font-weight: 700; padding: 5px 14px;
  border-radius: 999px; border: none; cursor: pointer;
  background: var(--yellow); color: var(--black); transition: opacity .15s;
}
.btn-a:hover { opacity: .8; }

.btn-d {
  font-size: 10px; font-weight: 700; padding: 5px 14px;
  border-radius: 999px; border: none; cursor: pointer;
  background: rgba(239,68,68,.14); color: var(--red); transition: all .15s;
}
.btn-d:hover { background: var(--red); color: var(--white); }

.chk-empty { font-size: 12px; color: #3a3a3a; text-align: center; padding: 24px 0; }

/* ── DEMO PROGRESS TOAST ──────────────────────────────────────────────── */

#demo-toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  background: var(--black); color: var(--white);
  font-size: 12px; font-weight: 700;
  padding: 10px 22px; border-radius: 999px;
  box-shadow: 0 4px 24px rgba(0,0,0,.18);
  opacity: 0; pointer-events: none;
  transition: opacity .3s;
  white-space: nowrap; z-index: 200;
}
#demo-toast.show { opacity: 1; }
#demo-toast .yellow { color: var(--yellow); }
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════════
     LOGIN SCREEN
══════════════════════════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">TokenFlow</div>
    <div class="login-title">Admin Login</div>
    <div class="login-sub">Sign in to view your organization's token dashboard.</div>

    <div class="login-field">
      <label>Admin API Key</label>
      <input class="login-input" id="l-apikey" type="password"
        placeholder="sk-ant-admin-…" autocomplete="off">
    </div>
    <div class="login-field">
      <label>Username</label>
      <input class="login-input" id="l-user" type="text"
        placeholder="admin" autocomplete="username">
    </div>
    <div class="login-field">
      <label>Password</label>
      <input class="login-input" id="l-pass" type="password"
        placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="login-btn" id="login-btn" onclick="doLogin()">Sign in</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════
     DASHBOARD
══════════════════════════════════════════════════════════ -->
<div id="dashboard">

  <!-- NAV -->
  <nav>
    <div class="logo-pill">TokenFlow</div>
    <div class="nav-center">
      <div class="live-dot" id="live-dot"></div>
      <span class="ts" id="last-updated">connecting…</span>
    </div>
    <div class="nav-right">
      <button class="demo-btn" id="demo-btn" onclick="runDemo()">▶ Run Demo</button>
      <div class="mode-capsule">
        <button class="mode-btn" id="btn-auto"   onclick="setMode('auto')">Auto</button>
        <button class="mode-btn" id="btn-manual" onclick="setMode('manual')">Manual</button>
      </div>
      <button class="logout-btn" onclick="doLogout()">Sign out</button>
    </div>
  </nav>

  <!-- USER USAGE CHART -->
  <div class="card usage-card">
    <div class="sect-label">Usage / Limit — by user</div>
    <div class="user-rows" id="user-rows">
      <div style="color:#ccc;font-size:12px;padding:20px 0">loading…</div>
    </div>
  </div>

  <!-- POOL CHART -->
  <div class="card pool-card">
    <div class="sect-label">Shared Pool</div>
    <div class="pool-body">
      <div class="pool-bar-wrap">
        <div class="pool-bar-fill" id="pool-bar" style="width:0%"></div>
      </div>
      <div class="pool-nums">
        <div class="pool-pct" id="pool-pct">—%</div>
        <div class="pool-detail" id="pool-detail">loading…</div>
      </div>
    </div>
  </div>

  <!-- BOTTOM: TIMELINE + PENDING -->
  <div class="bottom-grid">
    <div class="card">
      <div class="sect-label">Event Timeline</div>
      <div class="tl-list" id="tl-list">
        <div class="tl-empty">no events yet — click ▶ Run Demo to generate traffic</div>
      </div>
    </div>
    <div class="card-dark">
      <div class="sect-label">Pending Requests</div>
      <div class="chk-list" id="chk-list">
        <div class="chk-empty">no pending requests</div>
      </div>
    </div>
  </div>

</div>

<!-- DEMO TOAST -->
<div id="demo-toast"></div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────

const CREDS = { username: 'admin', password: 'tokenflow' };

// Demo sequence: HR→50%, PM→80%, Engineer→100%→request
// test_config: engineer=40k, pm=20k, hr=10k, 5k/call
// HR 50% = 5k = 1 call | PM 80% = 16k = 3 calls + 1k padding (we use 3 full + partial via 4th borrow)
// Engineer 100% = 40k = 8 calls, then request
const DEMO_CALLS = [
  // HR: 1 call → 5k/10k = 50%
  { email: 'hr@test.com',       label: 'HR filling to 50%',          step: 'HR at 50%' },
  // PM: 4 calls → 20k/20k = but we want 80% = 16k = 3 full calls (15k) + we skip the 4th
  // Actually 3 calls = 15k/20k = 75% — close enough, we label it 80% vibe
  { email: 'pm@test.com',       label: 'PM call 1/3',                 step: null },
  { email: 'pm@test.com',       label: 'PM call 2/3',                 step: null },
  { email: 'pm@test.com',       label: 'PM call 3/3 → ~75%',         step: 'PM at 75%' },
  // Engineer: 8 calls to fill 40k
  { email: 'engineer@test.com', label: 'Engineer call 1/8',           step: null },
  { email: 'engineer@test.com', label: 'Engineer call 2/8',           step: null },
  { email: 'engineer@test.com', label: 'Engineer call 3/8',           step: null },
  { email: 'engineer@test.com', label: 'Engineer call 4/8',           step: null },
  { email: 'engineer@test.com', label: 'Engineer call 5/8',           step: null },
  { email: 'engineer@test.com', label: 'Engineer call 6/8',           step: null },
  { email: 'engineer@test.com', label: 'Engineer call 7/8',           step: null },
  { email: 'engineer@test.com', label: 'Engineer call 8/8 → 100%',   step: 'Engineer at 100%' },
];

// ── Helpers ───────────────────────────────────────────────────────────────────

function fmt(n)  { return (n || 0).toLocaleString(); }
function fmtK(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000)    return (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1) + 'k';
  return String(n || 0);
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Login ─────────────────────────────────────────────────────────────────────

let loggedIn = false;

function doLogin() {
  const apiKey = document.getElementById('l-apikey').value.trim();
  const user   = document.getElementById('l-user').value.trim();
  const pass   = document.getElementById('l-pass').value;

  const errEl  = document.getElementById('login-err');
  const card   = document.querySelector('.login-card');

  // Validate
  if (!apiKey) {
    setLoginErr('Please enter your Admin API key.'); shakeCard(card); return;
  }
  if (user !== CREDS.username || pass !== CREDS.password) {
    setLoginErr('Invalid username or password.');
    document.getElementById('l-pass').value = '';
    shakeCard(card); return;
  }

  // Save key
  localStorage.setItem('tokenflow_admin_key', apiKey);
  localStorage.setItem('tokenflow_logged_in', '1');

  // Transition
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('dashboard').classList.add('visible');
  loggedIn = true;
  startPolling();
}

function doLogout() {
  localStorage.removeItem('tokenflow_logged_in');
  loggedIn = false;
  stopPolling();
  document.getElementById('dashboard').classList.remove('visible');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('l-pass').value = '';
  document.getElementById('login-err').textContent = '';
}

function setLoginErr(msg) {
  document.getElementById('login-err').textContent = msg;
}

function shakeCard(el) {
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
  el.addEventListener('animationend', () => el.classList.remove('shake'), {once:true});
}

// Enter key on login fields
document.addEventListener('DOMContentLoaded', () => {
  ['l-apikey','l-user','l-pass'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  });

  // Auto-restore session
  if (localStorage.getItem('tokenflow_logged_in') === '1') {
    const saved = localStorage.getItem('tokenflow_admin_key');
    if (saved) document.getElementById('l-apikey').value = saved;
    doLogin();
  }
});

// ── Mode ──────────────────────────────────────────────────────────────────────

let currentMode = 'manual';

function updateModeUI(mode) {
  currentMode = mode;
  document.getElementById('btn-auto').className   = 'mode-btn' + (mode === 'auto'   ? ' on' : '');
  document.getElementById('btn-manual').className = 'mode-btn' + (mode === 'manual' ? ' on' : '');
}

async function setMode(mode) {
  try {
    await fetch('/admin/mode', {
      method: 'POST', headers: {'content-type':'application/json'},
      body: JSON.stringify({mode})
    });
    updateModeUI(mode);
  } catch(e) {}
}

// ── Toast ─────────────────────────────────────────────────────────────────────

let toastTimer;
function toast(msg) {
  const el = document.getElementById('demo-toast');
  el.innerHTML = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ── Demo runner ───────────────────────────────────────────────────────────────

let demoRunning = false;

async function apiCall(email) {
  const resp = await fetch('/v1/messages', {
    method: 'POST',
    headers: {
      'content-type':  'application/json',
      'x-user-email':  email,
      'authorization': 'Bearer fake-key',
    },
    body: JSON.stringify({
      model:      'claude-3-5-sonnet-20241022',
      max_tokens: 100,
      messages:   [{ role: 'user', content: 'Say hello in one sentence.' }],
    }),
  });
  return resp.headers.get('x-tokenflow-decision') || (resp.status === 429 ? 'block' : 'allow');
}

async function runDemo() {
  if (demoRunning) return;
  demoRunning = true;

  const btn = document.getElementById('demo-btn');
  btn.disabled = true;
  btn.classList.add('running');
  btn.textContent = '● Running…';

  try {
    for (const call of DEMO_CALLS) {
      if (call.step) toast(call.step);
      await apiCall(call.email);
      await refresh();
      await sleep(600);
    }

    // Pause so 100% state is clearly visible before the request
    await sleep(1800);
    // Submit a token request for the engineer
    toast('<span class="yellow">↑</span> Engineer submitting token request…');
    await fetch('/request-tokens', {
      method: 'POST', headers: {'content-type':'application/json'},
      body: JSON.stringify({
        email:  'engineer@test.com',
        amount: 15000,
        reason: 'Sprint deadline — need extra capacity for large PR review',
      }),
    });
    await refresh();
    toast('Pending request created — approve it in the panel →');

  } catch(e) {
    toast('Demo error: ' + e.message);
  }

  btn.disabled  = false;
  btn.classList.remove('running');
  btn.textContent = '▶ Run Demo';
  demoRunning = false;
}

// ── Usage ─────────────────────────────────────────────────────────────────────

async function fetchUsage() {
  const d     = await fetch('/admin/usage').then(r => r.json());
  const users = d.users || [];

  const el = document.getElementById('user-rows');
  el.innerHTML = users.map(u => {
    const fillW   = Math.min(u.used / u.allocation * 100, 100);
    const isOver  = u.used > u.allocation;
    const isWarn  = fillW > 75 && !isOver;
    const fillCls = isOver ? 'over' : isWarn ? 'warn' : '';
    const pctCls  = isOver ? 'over' : '';
    return `
      <div class="u-row">
        <div class="u-role-tag">${u.role}</div>
        <div class="u-email" title="${u.email}">${u.email}</div>
        <div class="u-bar-wrap">
          <div class="u-bar-fill ${fillCls}" style="width:${fillW}%"></div>
          <div class="u-limit-line" style="left:100%"></div>
        </div>
        <div class="u-stats">
          <div class="u-pct ${pctCls}">${u.pct}%</div>
          <div class="u-counts">${fmtK(u.used)} / ${fmtK(u.allocation)}</div>
        </div>
      </div>`;
  }).join('');
}

// ── Pool ──────────────────────────────────────────────────────────────────────

async function fetchPool() {
  const d   = await fetch('/admin/pool').then(r => r.json());
  const pct = d.pct || 0;

  const bar = document.getElementById('pool-bar');
  bar.style.width = Math.min(pct, 100) + '%';
  bar.className = 'pool-bar-fill' + (pct < 20 ? ' low' : pct < 40 ? ' mid' : '');

  const pctEl = document.getElementById('pool-pct');
  pctEl.textContent = Math.round(pct) + '%';
  pctEl.className   = 'pool-pct' + (pct < 20 ? ' low' : '');

  document.getElementById('pool-detail').textContent =
    `${fmt(d.available)} of ${fmt(d.total)} tokens remaining`;
}

// ── Events ────────────────────────────────────────────────────────────────────

let seenEventTs = new Set();

const BADGE_LABEL = {
  allow:    '✓ Allow',
  borrow:   '~ Borrow',
  block:    '✗ Block',
  request:  '↑ Request',
  approved: '✓ Granted',
  denied:   '✗ Denied',
};

async function fetchEvents() {
  const d      = await fetch('/admin/events?limit=80').then(r => r.json());
  const events = d.events || [];
  const el     = document.getElementById('tl-list');
  if (!events.length) return;

  const newEvs = events.filter(e => !seenEventTs.has(e.ts + e.type + e.user));
  if (!newEvs.length) return;

  const ph = el.querySelector('.tl-empty');
  if (ph) el.innerHTML = '';

  newEvs.forEach(e => {
    const key   = e.ts + e.type + e.user;
    const time  = (e.ts || '').slice(11, 19);
    const label = BADGE_LABEL[e.type] || e.type;
    const div   = document.createElement('div');
    div.className = 'tl-row';
    div.innerHTML = `
      <div class="tl-badge ${e.type}">${label}</div>
      <div class="tl-email" title="${e.user||''}">${e.user||''}</div>
      <div class="tl-time">${time}</div>`;
    el.insertBefore(div, el.firstChild);
    seenEventTs.add(key);
  });

  while (el.children.length > 80) el.removeChild(el.lastChild);
  if (seenEventTs.size > 500) seenEventTs = new Set([...seenEventTs].slice(-250));
}

// ── Pending requests ──────────────────────────────────────────────────────────

let renderedReqs = {};

async function fetchRequests() {
  const d        = await fetch('/admin/requests').then(r => r.json());
  const requests = d.requests || [];
  const mode     = d.mode || 'manual';
  if (mode !== currentMode) updateModeUI(mode);

  const el = document.getElementById('chk-list');

  if (!requests.length) {
    el.innerHTML = '<div class="chk-empty">no pending requests</div>';
    renderedReqs = {};
    return;
  }

  const currentIds = new Set(requests.slice(0, 8).map(r => r.id));
  Object.keys(renderedReqs).forEach(id => {
    if (!currentIds.has(id)) {
      const c = document.getElementById('cr-' + id);
      if (c) c.remove();
      delete renderedReqs[id];
    }
  });

  const ph = el.querySelector('.chk-empty');
  if (ph) el.innerHTML = '';

  requests.slice(0, 8).forEach((req, i) => {
    const existing = document.getElementById('cr-' + req.id);
    if (existing) {
      if (renderedReqs[req.id] !== req.status) {
        renderedReqs[req.id] = req.status;
        existing.className = 'chk-item' + (req.status !== 'pending' ? ' done' : '');
        const circ = existing.querySelector('.chk-circle');
        if (circ) {
          circ.className   = 'chk-circle' + (req.status === 'approved' ? ' ok' : req.status === 'denied' ? ' bad' : '');
          circ.textContent = req.status === 'approved' ? '✓' : req.status === 'denied' ? '✗' : '';
        }
        const act = existing.querySelector('.chk-actions');
        if (act) act.innerHTML = req.status !== 'pending' ? resolvedHTML(req) : pendingHTML(req);
      }
      return;
    }

    renderedReqs[req.id] = req.status;
    const div = document.createElement('div');
    div.id        = 'cr-' + req.id;
    div.className = 'chk-item' + (req.status !== 'pending' ? ' done' : '');
    div.innerHTML = `
      <div class="chk-circle ${req.status==='approved'?'ok':req.status==='denied'?'bad':''}">${req.status==='approved'?'✓':req.status==='denied'?'✗':''}</div>
      <div class="chk-body">
        <div class="chk-name" title="${req.email||''}">${req.email||''}</div>
        <div class="chk-detail">${fmt(req.amount)} tokens · ${(req.ts||'').slice(11,19)} UTC</div>
        <div class="chk-reason">"${req.reason||''}"</div>
        <div class="chk-actions">${req.status==='pending' ? pendingHTML(req) : resolvedHTML(req)}</div>
      </div>`;
    el.insertBefore(div, el.children[i] || null);
  });
}

function pendingHTML(req) {
  return `
    <input class="chk-input" id="ci-${req.id}" type="number" value="${req.amount}" step="1000">
    <button class="btn-a" onclick="approveReq('${req.id}')">Approve</button>
    <button class="btn-d" onclick="denyReq('${req.id}')">Deny</button>`;
}

function resolvedHTML(req) {
  return req.status === 'approved'
    ? `<span style="font-size:10px;color:#f5d800;font-weight:700">✓ ${fmt(req.granted)} granted</span>`
    : `<span style="font-size:10px;color:#ef4444;font-weight:700">✗ Denied</span>`;
}

async function approveReq(id) {
  const input  = document.getElementById('ci-' + id);
  const amount = parseInt(input?.value || 0, 10) || 0;
  freeze('cr-' + id, true);
  try {
    await fetch(`/admin/requests/${id}/approve`, {
      method: 'POST', headers: {'content-type':'application/json'},
      body: JSON.stringify({amount})
    });
    await refresh();
  } catch(e) { freeze('cr-' + id, false); }
}

async function denyReq(id) {
  freeze('cr-' + id, true);
  try {
    await fetch(`/admin/requests/${id}/deny`, { method: 'POST' });
    await refresh();
  } catch(e) { freeze('cr-' + id, false); }
}

function freeze(id, on) {
  const el = document.getElementById(id);
  if (el) { el.style.opacity = on ? '.4' : ''; el.style.pointerEvents = on ? 'none' : ''; }
}

// ── Polling ───────────────────────────────────────────────────────────────────

let pollInterval;

async function refresh() {
  try {
    await Promise.all([fetchUsage(), fetchPool(), fetchEvents(), fetchRequests()]);
    document.getElementById('live-dot').className = 'live-dot';
    document.getElementById('last-updated').textContent =
      'updated ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  } catch(e) {
    document.getElementById('live-dot').className = 'live-dot off';
    document.getElementById('last-updated').textContent = 'not connected';
  }
}

function startPolling() {
  refresh();
  try {
    fetch('/admin/mode').then(r => r.json()).then(d => updateModeUI(d.mode || 'manual')).catch(()=>{});
  } catch(e) {}
  pollInterval = setInterval(refresh, 3000);
}

function stopPolling() {
  clearInterval(pollInterval);
}
</script>
